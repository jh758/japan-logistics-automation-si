<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>글로벌 물류 자동화 System Integrator 자료</title>
  <style>
    :root{--navy:#102a43;--blue:#1769aa;--line:#d8e1ea;--bg:#f5f7fa;--muted:#667085}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);font-family:Inter,"Noto Sans KR","Noto Sans JP",Arial,sans-serif;color:var(--navy)}
    .tab-shell{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 4px 16px rgba(16,42,67,.08);backdrop-filter:blur(10px)}
    .tab-wrap{max-width:1180px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:18px}
    .brand{font-size:14px;font-weight:800;white-space:nowrap}
    .tabs{display:grid;grid-template-columns:repeat(4,minmax(82px,1fr));gap:8px;width:min(600px,100%)}
    .tab{appearance:none;border:1px solid var(--line);border-radius:10px;background:#fff;color:#475467;padding:10px 16px;font:inherit;font-size:14px;font-weight:750;cursor:pointer;transition:.18s ease}
    .tab:hover{border-color:#8bb6d6;color:var(--blue);background:#f7fbfe}
    .tab[aria-selected="true"]{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:0 3px 9px rgba(23,105,170,.22)}
    .viewer{display:block;width:100%;min-height:calc(100vh - 70px);border:0;background:var(--bg)}
    .loading{position:fixed;top:82px;right:18px;z-index:10;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 12px;color:var(--muted);font-size:12px;box-shadow:0 3px 10px rgba(16,42,67,.08)}
    .loading[hidden]{display:none}
    @media(max-width:720px){.tab-wrap{display:block;padding:10px 12px}.brand{margin:0 0 8px 2px}.tabs{width:100%;gap:6px}.tab{padding:9px 6px}.viewer{min-height:calc(100vh - 112px)}}
  </style>
</head>
<body>
  <nav class="tab-shell" aria-label="국가별 물류 자동화 자료">
    <div class="tab-wrap">
      <div class="brand">물류 자동화 SI</div>
      <div class="tabs" role="tablist" aria-label="국가 선택">
        <button class="tab" role="tab" id="tab-japan" aria-selected="true" data-country="japan">일본</button>
        <button class="tab" role="tab" id="tab-usa" aria-selected="false" data-country="usa">미국</button>
        <button class="tab" role="tab" id="tab-china" aria-selected="false" data-country="china">중국</button>
        <button class="tab" role="tab" id="tab-europe" aria-selected="false" data-country="europe">유럽</button>
      </div>
    </div>
  </nav>
  <div class="loading" id="loading" hidden>자료 불러오는 중…</div>
  <iframe class="viewer" id="viewer" title="국가별 물류 자동화 SI 자료" src="japan_logistics_automation_si.html"></iframe>
  <script>
    const reports={
      japan:'japan_logistics_automation_si.html',
      usa:'usa_logistics_automation_si.html',
      china:'china_logistics_automation_si.html',
      europe:'europe_logistics_automation_si.html'
    };
    const labels={japan:'일본',usa:'미국',china:'중국',europe:'유럽'};
    const viewer=document.getElementById('viewer');
    const loading=document.getElementById('loading');
    const tabs=[...document.querySelectorAll('.tab')];

    function resizeViewer(){
      try{
        const doc=viewer.contentDocument;
        if(!doc)return;
        const height=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight);
        viewer.style.height=`${height}px`;
      }catch(_){viewer.style.height='calc(100vh - 70px)'}
    }

    function selectCountry(country,{updateHash=true}={}){
      if(!reports[country])country='japan';
      tabs.forEach(tab=>{
        const active=tab.dataset.country===country;
        tab.setAttribute('aria-selected',String(active));
        tab.tabIndex=active?0:-1;
      });
      loading.hidden=false;
      viewer.style.height='calc(100vh - 70px)';
      viewer.src=reports[country];
      viewer.title=`${labels[country]} 물류 자동화 SI 자료`;
      document.title=`${labels[country]} 물류 자동화 SI | 글로벌 자료`;
      if(updateHash)history.replaceState(null,'',`#${country}`);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    tabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>selectCountry(tab.dataset.country));
      tab.addEventListener('keydown',event=>{
        if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
        event.preventDefault();
        let next=index;
        if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;
        if(event.key==='ArrowRight')next=(index+1)%tabs.length;
        if(event.key==='Home')next=0;
        if(event.key==='End')next=tabs.length-1;
        tabs[next].focus();
        selectCountry(tabs[next].dataset.country);
      });
    });

    viewer.addEventListener('load',()=>{
      loading.hidden=true;
      resizeViewer();
      setTimeout(resizeViewer,300);
      setTimeout(resizeViewer,1200);
    });
    window.addEventListener('resize',resizeViewer);
    selectCountry(location.hash.slice(1)||'japan',{updateHash:false});
  </script>
</body>
</html>
